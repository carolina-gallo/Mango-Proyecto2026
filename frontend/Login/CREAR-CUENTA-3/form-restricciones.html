<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus gustos y restricciones</title>
    <link rel="stylesheet" href="../../General/general.css">
    <link rel="stylesheet" href="form-restricciones.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>

</head>
<body>
    <main class="app">
        <header class="header">
            <a href="crear-cuenta.html" class="volver"><img src="Flecha-atras.png" alt="Flecha"></a>
            <h1 class="titulo">FORMULARIO DE DIETAS Y RESTRICCIONES</h1>
        </header>

        <form class="opciones" id="formRestricciones">
            <article class="cositos">
                <input type="checkbox" id="celiacx" class="caja-input">
                <label for="celiacx" class="cuadrado"></label>
                <p class="texto">Celiaquía</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="diabeticx" class="caja-input">
                <label for="diabeticx" class="cuadrado"></label>
                <p class="texto">Diabetes</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="Intolerantealalactosa" class="caja-input">
                <label for="Intolerantealalactosa" class="cuadrado"></label>
                <p class="texto">Intolerancia a la lactosa</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="hipertensx" class="caja-input">
                <label for="hipertensx" class="cuadrado"></label>
                <p class="texto">Hipertención</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="Bajoencolesterol" class="caja-input">
                <label for="Bajoencolesterol" class="cuadrado"></label>
                <p class="texto">Colesterol alto</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="alergiafrutossecos" class="caja-input">
                <label for="alergiafrutossecos" class="cuadrado"></label>
                <p class="texto">Alergia a frutos secos</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="veganx" class="caja-input">
                <label for="veganx" class="cuadrado"></label>
                <p class="texto">Dieta vegana</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="vegetarianx" class="caja-input">
                <label for="vegetarianx" class="cuadrado"></label>
                <p class="texto">Dieta Vegetariana</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="keto" class="caja-input">
                <label for="keto" class="cuadrado"></label>
                <p class="texto">Dieta Keto</p>
            </article>

            <article class="cositos">
                <input type="checkbox" id="kosher" class="caja-input">
                <label for="kosher" class="cuadrado"></label>
                <p class="texto">Dieta Kosher</p>
            </article>

            <button type="button" class="continuar" id="botonlogin">Continuar</button>

        </form>

    </main>
    <script src="form-restricciones.js"></script>
</body>
</html>
