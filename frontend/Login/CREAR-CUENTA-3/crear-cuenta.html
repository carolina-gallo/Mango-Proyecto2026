<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>

    <link rel="stylesheet" href="../../General/general.css">
    <link rel="stylesheet" href="crear-cuenta.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>

</head>

<body>
    <main class="app">
        <header class="header">
            <a href="../INICIAR-SESION-2/inicio-sesion.html" class="volver"><img src="Flecha-atras.png" alt="Flecha"></a>
            <section class="principio">
                <h1 class="bienvenido">BIENVENIDO A</h1>
                <article class="barra-secundaria"><img class="barra-secundaria" src="Mango.png" alt="Mango"></article>
            </section>
        </header>

        <form class="datoscuenta" id="formulario">
            <section class="datos" id="datos">
                <input id="nombre" name="nombre" class="campo-bot" type="text" placeholder="Nombre" required>
                <input id="apellido" name="apellido" class="campo-bot" type="text" placeholder="Apellido" required>
                <input id="username" name="username" class="campo-bot" type="text" placeholder="Nombre de usuario" required>
                <input id="mail" name="mail" class="campo-bot" type="text" placeholder="Mail" required>
                <input id="contraseña" name="contraseña" type="password" class="campo-bot" placeholder="Contraseña" required>
            </section>
            <p class="textofinal">Tu próxima receta favorita empieza acá.</p>
           <button type="submit" class="continuar" id="botonRegistrar">
             Continuar
            </button>
        </form>
    </main>
    <script src="crear-cuenta.js"></script>
</body>
</html>
