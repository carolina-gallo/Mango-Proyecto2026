<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tienda</title>

    <link rel="stylesheet" href="tienda.css">
    <link rel="stylesheet" href="../General/general.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
    </style>
</head>

<body>
    <header class="header-editar-perfil">
        <a href="perfil.html">
            <img class="boton-volver" src="flechabandeja.png" alt="Volver">
        </a>
        <p class="editarperfiltexto">Tienda</p>
        <article class="mangoymanguitos">
            <img class="mango" src="../Logo.png" alt="mango">
            <p class="cantmanguitos" id="cantManguitos"></p>
        </article>
    </header>

    <section class="ftperfil">
        <img class="circuloperfil" id="ftdeperfil" src="" alt="foto perfil">
        <p class="cambiatexto">Cambia tu avatar</p>
    </section>

    <section class="otros-avatares" id="listaAvatares">
    <button type="button" class="opcionavatar" data-avatar="./avatar1" data-precio="0"
            data-descripcion="Todo empieza con un primer bocado.">
        <img class="ft-avatar" src="Magui.png" alt="Magui">
        <span class="nombre-avatar">Magui</span>
        <p class="descripcion"></p>
    </button>
    <button type="button" class="opcionavatar" data-avatar="./avatar2" data-precio="80"
            data-descripcion="Un buen día empieza con algo rico.">
        <img class="ft-avatar" src="ridett.png" alt="Ridett">
        <span class="nombre-avatar">Ridett</span>
        <p class="descripcion"></p>
    </button>
    <button type="button" class="opcionavatar" data-avatar="./avatar3" data-precio="120"
            data-descripcion="Cocinar también es una forma de querer.">
        <img class="ft-avatar" src="koroko.png" alt="Koroko">
        <span class="nombre-avatar">Koroko</span>
        <p class="descripcion"></p>
    </button>
    <button type="button" class="opcionavatar" data-avatar="./avatar4" data-precio="150"
            data-descripcion="El estilo también se sirve en la mesa.">
        <img class="ft-avatar" src="Aŭro.png" alt="Aŭro">
        <span class="nombre-avatar">Aŭro</span>
        <p class="descripcion"></p>
    </button>
    <button type="button" class="opcionavatar" data-avatar="./avatar5" data-precio="200"
            data-descripcion="El sabor tiene sus secretos, y yo los conozco.">
        <img class="ft-avatar" src="Majstra kuiristo.png" alt="Majstra kuiristo">
        <span class="nombre-avatar">Majstra kuiristo</span>
        <p class="descripcion"></p>
    </button>
    </section>

    <dialog class="tienda-popup" id="popupCompra">
        <img class="tienda-popup-foto" id="compraFoto" src="" alt="">
        <p class="tienda-popup-titulo" id="compraTitulo"></p>
        <p class="tienda-popup-texto" id="compraTexto"></p>
        <p class="tienda-popup-error" id="compraError" hidden></p>
        <div class="tienda-popup-botones">
            <button type="button" class="tienda-boton-secundario" id="compraCancelar">Cancelar</button>
            <button type="button" class="tienda-boton-principal" id="compraConfirmar">Comprar</button>
        </div>
    </dialog>

    <footer class="footer">
    <a href="../Home/homeposts.html">
        <img class="fotoEnElFooter" src="../home negro.png" alt="foto home">
    </a>
    <a href="../Mensajeria/mensajes.html">
        <img class="fotoEnElFooter" src="../mensajeria negro.png" alt="foto mensajeria">
    </a>
    <div>
    <a href="#" class="fcuadraditote" id="botonMas">
        <img class="fotoEnElFooter" src="../mas negro.png" alt="mas">
    </a>
    </div>
    <a href="../Rachas/rachas.html">
        <img class="fotoEnElFooter" src="../triple m negro.png" alt="foto rachas">
    </a>
    <a href="../Perfil/perfil.html">
        <img class="fotoEnElFooter" src="../perfil naranja.png" alt="foto perfil naranja">
    </a>
    </footer>

    <dialog class="menuCrearpopup" id="menuCrearpopup">
        <section class="crearpopup" id="crearpopup">
            <a href="../Añadir/Añadir-publicación.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Post</div>
                    <div class="marcaelmomentopopup">Subi un post y marca el momento</div>
                </section>
            </a>
            <a href="../Añadir/Añadir-receta.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Receta</div>
                    <div class="marcaelmomentopopup">Compartí tu receta y dejá tu huella.</div>
                </section>
            </a>
        </section>
    </dialog>

    <script src="tienda.js"></script>
    <script src="../General/general.js"></script>
</body>
</html>
