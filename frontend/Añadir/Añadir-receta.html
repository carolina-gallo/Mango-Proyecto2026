                    </button>

                    <button class="filtro-circular" data-filtro="sin_lactosa">

                    <button class="filtro-circular" data-filtro="sin_azucar">

                    </button>

                    <button class="filtro-circular" data-filtro="vegano">

                    <button class="filtro-circular2" data-filtro="sin_tacc">

                        <span class="nombre-filtro">Sin lactosa</span>
