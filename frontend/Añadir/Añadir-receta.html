<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear</title>

    <link rel="stylesheet" href="Añadir-receta.css">
    <link rel="stylesheet" href="../General/general.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
</head>

<body>
    <div class="app">
        <main class="main">
            <header class="header">
                <a href="../Home/homeposts.html">
                    <img class="atras" src="Atras.png" alt="atras">
                </a>
            </header>  
            <h1 class="htexto">CREAR RECETA<h1>
            <form class=form id="formReceta">
                <section class="imagenytituloo">
                    <button type="button" class="subir-imagen">
                        <img class="camaritauwu" src="camara.png" alt="camarita">
                        <h2 class="h2">Añade una imagen</h2>
                    </button>
                    <input type="file" id="inputImagen" accept="image/*" hidden>
                    <input class="titulo" name="titulo" placeholder="Agregar titulo"></input>
                </section>
            
                <textarea class="descripcion" name="descripcion" placeholder="Añade una descripción..."></textarea>

                <div class = "ingrparaqueyatengaelmargen">
                <h1 class="htexto">Ingredientes</h1>
                </div>
                <label for="ingredientes"></label>
                <div class="contenedor-ingredientes">
                    <input type="text" name="ingredientes" class="ingredientes" placeholder="200gr de azúcar blanca">
                </div>
                <button type="button" id="agregaringrediente" class="ingrediente">
                    <img class="agregaringredientefoto" src="Vector.png" alt="mas">
                    <p class="otroingrediente">Ingrediente</p>
                </button>
                
                <div class = "ingrparaqueyatengaelmargen">
                <h1 class="htexto">Pasos</h1>
                </div>
                <label for="pasos"></label>
                <section class="contenedor-pasos">
                    <div class="numeroypaso">
                        <div class="numero">1</div>
                        <textarea name="pasos" class="pasos" placeholder="Mezcla la manteca con  el azucar hasta que quede una mexcla homogenea."></textarea>
                    </div>
                    <div class="numeroypaso">
                        <div class="numero">2</div>
                        <textarea name="pasos" class="pasos" placeholder="Mezcla la manteca con  el azucar hasta que quede una mexcla homogenea."></textarea>
                    </div>
                    <div class="numeroypaso">
                        <div class="numero">3</div>
                        <textarea name="pasos" class="pasos" placeholder="Mezcla la manteca con  el azucar hasta que quede una mexcla homogenea."></textarea>
                    </div>
                </section>
                <button type="button" id="agregarpaso" class="ingrediente">
                    <img class="agregaringredientefoto" src="Vector.png" alt="mas">
                    <p class="otroingrediente">Paso</p>
                </button>

                <h1 class="htexto">Trucos</h1>
                <textarea name="trucos" class="trucos" placeholder="¿Algun Tip para que quede perfecto?"></textarea>

                <article class="filtrosgeneral">
                    <h4>Filtros</h4>
                    <section class="opcionesrestricciones">
                        <button type="button" class="filtro-circular1" data-filtro="celiacx">
                            <img class="circulo" src="../Sin tacc.png" alt="sin tacc">
                            <span class="nombre-filtro">Sin TACC</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="veganx">
                            <img class="circulo" src="../Vegano.png" alt="vegano">
                            <span class="nombre-filtro">Vegano</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="vegetarianx">
                            <img class="circulo" src="../Vegetariano.png" alt="vegetariano">
                            <span class="nombre-filtro">Vegetariano</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="kosher">
                            <img class="circulo" src="../Kosher.png" alt="kosher">
                            <span class="nombre-filtro">Kosher</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="hipertensx">
                            <img class="circulo" src="../Hipertencion.png" alt="hipertenso">
                            <span class="nombre-filtro">Hipertenso</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="diabetix">
                            <img class="circulo" src="../Diabetes.png" alt="diabetes">
                            <span class="nombre-filtro">Sin azucar</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="bajo colesterol">
                            <img class="circulo" src="../Bajo colesterol.png" alt="bajo colesterol">
                            <span class="nombre-filtro">Bajo colesterol</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="keto">
                            <img class="circulo" src="../keto.png" alt="keto">
                            <span class="nombre-filtro">Keto</span>
                        </button>
                        <button type="button" class="filtro-circular" data-filtro="alergia a frutos secos">
                            <img class="circulo" src="../A. mani.png" alt="frutos secos">
                            <span class="nombre-filtro">Sin frutos secos</span>
                        </button>
                        <button type="button" class="filtro-circular2" data-filtro="intolerancia a la lactosa">
                            <img class="circulo" src="../Intolerancia a la lactosa.png" alt="intolerancia a la lactosa">
                            <span class="nombre-filtro">Sin lactosa</span>
                        </button>
                    </section>

                    <section class="saboresytiempos" id="sabor">
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="dulce">
                            <span>Dulce</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="salado">
                            <span>Salado</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="umami">
                            <span>Umami</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="picante">
                            <span>Picante</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="agridulce">
                            <span>Agridulce</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="acido">
                            <span>Ácido</span>
                        </button>
                    </section>

                    <section class="saboresytiempos" id="tiempo">
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="1-15min">
                            <span>1-15m</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="15-30min">
                            <span>15-30m</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="30-60min">
                            <span>30-60m</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo" data-saborytiempoydifymetodo="60+min">
                            <span>+60m</span>
                        </button>
                    </section>

                    <section class="tiposdecomidas" id="tipo">
                        <button type="button" class="tipodecomida" data-tipo="bebida">
                            <span class="cuadradito"></span>
                            <span class="nombre-comida">Bebida</span>
                        </button>
                        <button type="button" class="tipodecomida" data-tipo="postre">
                            <span class="cuadradito"></span>
                            <span class="nombre-comida">Postre</span>
                        </button>
                        <button type="button" class="tipodecomida" data-tipo="comida">
                            <span class="cuadradito"></span>
                            <span class="nombre-comida">Comida</span>
                        </button>
                        <button type="button" class="tipodecomida" data-tipo="snack">
                            <span class="cuadradito"></span>
                            <span class="nombre-comida">Snack</span>
                        </button>
                    </section>

                    <h3 class="dificultad">Dificultad</h3>
                    <section class="difsymetodo" id="dificultad"> 
                        <button type="button" class="saborytiempoydifymetodo dificultadd" data-saborytiempoydifymetodo="alta">
                            <span>Alta</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo dificultadd" data-saborytiempoydifymetodo="media">
                            <span>Media</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo dificultadd" data-saborytiempoydifymetodo="baja">
                            <span>Baja</span>
                        </button>
                    </section>

                    <h3 class="metodousado">¿Que metodo de cocción usaste?</h3>
                    <section class="difsymetodo" id="metodo">  
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="horno">
                            <span>Horno</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="airfryer">
                            <span>Airfryer</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="sarten">
                            <span>Sartén</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="olla">
                            <span>Olla</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="microondas">
                            <span>Microondas</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="heladera">
                            <span>Heladera</span>
                        </button>
                        <button type="button" class="saborytiempoydifymetodo metodo" data-saborytiempoydifymetodo="nada">
                            <span>Nada</span>
                        </button>
                    </section>

                </article>

                <button type="submit" class="publicar" id="publicar">Publicar</button>

            </form>
        <script src="añadir-receta.js"></script>
    </div>
    </body>
    </html>
