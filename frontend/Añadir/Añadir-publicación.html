<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear</title>

    <link rel="stylesheet" href="Añadir-publicación.css">
    <link rel="stylesheet" href="../General/general.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
</head>

<body>
<div class="app">
    <main class="main">
        <header class="header">
            <a href="Añadir.html" class="atras"> ← </a>
        </header>  
            <div class="texto-superior"> 
                <h1 class="htexto">CREAR POST</h1>
            </div>
        <form class="form" id="formPost">
            <button type="button" class="subir-imagen">
                <img class="camaritauwu" src="camara.png" alt="camarita">
                <h2 class="h2">Agregar foto</h2>
            </button>
            <textarea class="descripcion" id="descripcion" name="descripcion" placeholder="Añade una descripción..."></textarea>
            <button type="button" class="vinculo" id="botonVinculo">
                <img class="simboloenlace" src="simboloenlace.png" alt="enlace">
                <span class="vinculartexto">Vincula la receta</span>
                <img class="masdevinculo" src="simbolomas.png" alt="más">
            </button>

            <input type="hidden" name="idDeReceta" id="idReceta">

            <button type="submit" class="publicar" id="publicar">Publicar</button>
        </form>

        <dialog class="buscadorDeRecetas" id="buscadorRecetas">
            
        </dialog>
    </main>
    <script src="añadir-publicación.js"></script>
</div>
</body>
</html>
