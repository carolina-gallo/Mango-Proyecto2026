<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link rel="stylesheet" href="buscadorrecetas.css">
    <link rel="stylesheet" href="../General/general.css">
    <link rel="stylesheet" href="buscadorgeneral.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
</head>

<body>
    <header>
        <section class="header-buscador">
        <article class="barra-superior">
            <div class="buscar">
                <img src="icono-buscador.png" alt="icono-buscador" class="vector">
                <input type="text" class="inputbuscador" placeholder="Qué haces hoy?" id="inputBuscar">
            </div>
            <img class ="logo" src="../Logo.png" alt="Logo-Mango">
        </article>
        <div class="elegi">
            <button id="btn-recetas" class="opciones seleccion">Recetas</button>
            <button id="btn-posts" class="opciones toco"><a class="a" href="../Home/buscadorposts.html">Posts</a></button>
            <button id="btn-perfil" class="opciones toco"><a class="a" href="../Home/buscadorperfiles.html">Perfil</a></button>
        </div>
        </section>
    <section class="filtros-header">
        <h1 class="restricciones">Restricciones y Dietas</h1>
        <section class="restriccionesydietas">
            <button type="button" class="filtro-circular" data-filtro="celiacx">
                <img class="circulo" src="../Sin tacc.png" alt="sin tacc">
            </button>
            <button type="button" class="filtro-circular" data-filtro="veganx">
                <img class="circulo" src="../Vegano.png" alt="vegano">
            </button>
            <button type="button" class="filtro-circular" data-filtro="vegetarianx">
                <img class="circulo" src="../Vegetariano.png" alt="vegetariano">
            </button>
            <button type="button" class="filtro-circular" data-filtro="kosher">
                <img class="circulo" src="../Kosher.png" alt="kosher">
            </button>
            <button type="button" class="filtro-circular" data-filtro="hipertensx">
                <img class="circulo" src="../Hipertencion.png" alt="hipertenso">
            </button>
            <button type="button" class="filtro-circular" data-filtro="diabeticx">
                <img class="circulo" src="../Diabetes.png" alt="diabetes">
            </button>
            <button type="button" class="filtro-circular" data-filtro="bajo colesterol">
                <img class="circulo" src="../Bajo colesterol.png" alt="bajo colesterol">
            </button>
            <button type="button" class="filtro-circular" data-filtro="keto">
                <img class="circulo" src="../keto.png" alt="keto">
            </button>
            <button type="button" class="filtro-circular" data-filtro="alergia a frutos secos">
                <img class="circulo" src="../A. mani.png" alt="frutos secos">
            </button>
            <button type="button" class="filtro-circular" data-filtro="intolerancia a la lactosa">
                <img class="circulo" src="../Intolerancia a la lactosa.png" alt="intolerancia a la lactosa">
            </button>
        </section>
        <section class="otrosfiltros">
            <h1 class="restricciones">Otros filtros</h1>
            <article class="muchascositas">
                <button type="button" class="filtros-random sabor" data-filtro="dulce">
                <span>Dulce</span>
                </button>
                <button type="button" class="filtros-random sabor" data-filtro="salado">
                    <span>Salado</span>
                </button>
                <button type="button" class="filtros-random sabor" data-filtro="umami">
                    <span>Umami</span>
                </button>
                <button type="button" class="filtros-random sabor" data-filtro="picante">
                    <span>Picante</span>
                </button>
                <button type="button" class="filtros-random sabor" data-filtro="agridulce">
                    <span>Agridulce</span>
                </button>
                <button type="button" class="filtros-random sabor" data-filtro="acido" >
                    <span>Ácido</span>
                </button>

                <button type="button" class="filtros-random tipodecomida" data-filtro="bebida">
                    <span class="cuadradito"></span>
                    <span class="nombre-comida">Bebida</span>
                </button>
                <button type="button" class="filtros-random tipodecomida" data-filtro="postre">
                    <span class="cuadradito"></span>
                    <span class="nombre-comida">Postre</span>
                </button>
                <button type="button" class="filtros-random tipodecomida" data-filtro="comida">
                    <span class="cuadradito"></span>
                    <span class="nombre-comida">Comida</span>
                </button>
                <button type="button" class="filtros-random tipodecomida" data-filtro="snack">
                    <span class="cuadradito"></span>
                    <span class="nombre-comida">Snack</span>
                </button>
            </article>

            <article class="muchascositas">
                <button type="button" class="filtros-random tiempo" data-filtro="1-15min">
                    <span>1-15m</span>
                </button>
                <button type="button" class="filtros-random tiempo" data-filtro="15-30min">
                    <span>15-30m</span>
                </button>
                <button type="button" class="filtros-random tiempo" data-filtro="30-60min">
                    <span>30-60m</span>
                </button>
                <button type="button" class="filtros-random tiempo" data-filtro="+60min">
                    <span>+60m</span>
                </button>

                    <button type="button" class="filtros-random dificultad" data-filtro="alta">
                        <span>Alta</span>
                    </button>
                    <button type="button" class="filtros-random dificultad" data-filtro="media">
                        <span>Media</span>
                    </button>
                    <button type="button" class="filtros-random dificultad" data-filtro="baja">
                        <span>Baja</span>
                    </button>

                    <button type="button" class="filtros-random metodo" data-filtro="horno">
                        <span>Horno</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="airfryer">
                        <span>Airfryer</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="sarten">
                        <span>Sartén</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="olla">
                        <span>Olla</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="microondas">
                        <span>Microondas</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="heladera">
                        <span>Heladera</span>
                    </button>
                    <button type="button" class="filtros-random metodo" data-filtro="nada">
                        <span>Nada</span>
                    </button>
            </article>
        </section>
    </section>
    <section class="objetosfiltrados" id="objetosfiltrados" hidden></section>
    <div class="flecha-cerrar" id="flecha-cerrar">
        <img src="flecha-abajo.png" alt="cerrar-filtros" class="cerrar">
    </div>
</header>

    <main class="scrolleo" id="recetas">
    </main>

   <dialog class="bandejas-fondo" id="popupBandejas">
    <section class="bandejas-popup" id="cajaPopupBandejas">

        
        <article class="bandejas-vista" id="vistaOpciones">
            <button class="bandejas-opcion" id="botonCrearBandeja">
                <span>Crear bandeja</span>
                <span class="bandejas-opcion-icono"><img src="mas-bandeja.png" alt="mas"></span>
            </button>
            <button class="bandejas-opcion" id="botonBandejaExistente">
                <span>Agregar a bandeja ya existente</span>
                <span class="bandejas-opcion-icono"><img src="flecha-bandeja.png" alt="flecha"></span>
            </button>
        </article>

        
        <article class="bandejas-vista" id="vistaBandejas" hidden>
            <section class="bandejas-grilla" id="grillaBandejas"></section>
            <button class="bandejas-guardar" id="botonGuardarEnBandeja">Guardar</button>
        </article>

        
        <article class="bandejas-vista" id="vistaNuevaBandeja" hidden>
            <input type="text" class="bandejas-nombre" id="inputNombreBandeja" placeholder="Nombre">
            <button class="bandejas-guardar" id="botonGuardarNuevaBandeja">Guardar</button>
        </article>
    </section>
</dialog>

   

    <footer class="footer">
    <a href="../Home/homeposts.html">
        <img class="fotoEnElFooter" src="../home naranja.png" alt="foto home naranja">
    </a>
    <a href="../Mensajeria/mensajes.html">
        <img class="fotoEnElFooter" src="../mensajeria negro.png" alt="foto mensajeria">
    </a>
    <div>
    <a href="#" class="fcuadraditote" id="botonMas">
        <img class="fotoEnElFooter" src="../mas negro.png" alt="mas">
    </a>
    </div>
    <a href="../Rachas/rachas.html">
        <img class="fotoEnElFooter" src="../triple m negro.png" alt="foto rachas">
    </a>
    <a href="../Perfil/perfil.html">
        <img class="fotoEnElFooter" src="../perfil negro.png" alt="foto perfil">
    </a>
    </footer>

    <dialog class="menuCrearpopup" id="menuCrearpopup">
        <section class="crearpopup" id="crearpopup">
            <a href="../Añadir/Añadir-publicación.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Post</div>
                    <div class="marcaelmomentopopup">Subi un post y marca el momento</div>
                </section>
            </a>
            <a href="../Añadir/Añadir-receta.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Receta</div>
                    <div class="marcaelmomentopopup">Compartí tu receta y dejá tu huella.</div>
                </section>
            </a>
        </section>
    </dialog>
    

</main>

<script src="buscadorrecetas.js"></script>
<script src="homerecetas.js"></script>
<script src="../General/general.js"></script>
</body>
</html>
