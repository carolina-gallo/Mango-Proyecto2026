<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="homerecetas.css">
    <link rel="stylesheet" href="../General/general.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
</head>
<body>
    <main class="app">
        <header class="encabezado" id="header">
            <div class="contenedor"> 
             <a href="buscadorrecetas.html"><img src="../buscador-vector.png" alt="buscar" class="buscador"></a>
              <section class="cajita">
                 <button class="opciones toco" id="posteo"><a class="a" href="homeposts.html">Posts</a></button>
                 <button class="opciones seleccion">Recetas</button>
             </a>
             </section>
             <div class="logo"><img class="logo" src="../Logo.png" alt="Logo Mango"></div>
         </div>
         </header>
    
    <main class="scrolleo" id="recetas">

        <section class="publicacion">
            <figure class="imagen">
                <img class="corazon" src="likenegro.png" alt="like">
                <img class="fotoReceta" id="fotoReceta" src="ruta-de-la-imagen.jpg" alt="Foto de la receta"></img>
                <p class="nombredeusuario" id="username"></p>
            </figure>
            <div class="contenido">
                <h2 class="titulo" id="tituloReeceta">Receta de ejemplo</h2>
                <p class="descripcion" id="descripcion">Esta es una breve descripción de la receta.</p>
            </div>
            <div class="interacciones">
                <span class="icono"><img class="guardado" src="guardado.png" alt="guardar"></span>
                <span class="icono"><img class="comentarios" src="comentariosr.png" alt="comentar"></span>
                <span class="icono"><img class="hipervinculo" src="link.png" alt="hipervinculo"></span>
            </div>
            <div class="filtros"></div>
        </section>
    </main>

   <dialog class="bandejas-fondo" id="popupBandejas">
    <section class="bandejas-popup" id="cajaPopupBandejas">

        
        <article class="bandejas-vista" id="vistaOpciones">
            <button class="bandejas-opcion" id="botonCrearBandeja">
                <span>Crear bandeja</span>
                <span class="bandejas-opcion-icono"><img src="mas-bandeja.png" alt="mas"></span>
            </button>
            <button class="bandejas-opcion" id="botonBandejaExistente">
                <span>Agregar a bandeja ya existente</span>
                <span class="bandejas-opcion-icono"><img src="flecha-bandeja.png" alt="flecha"></span>
            </button>
        </article>

        
        <article class="bandejas-vista" id="vistaBandejas" hidden>
            <section class="bandejas-grilla" id="grillaBandejas"></section>
            <button class="bandejas-guardar" id="botonGuardarEnBandeja">Guardar</button>
        </article>

        
        <article class="bandejas-vista" id="vistaNuevaBandeja" hidden>
            <input type="text" class="bandejas-nombre" id="inputNombreBandeja" placeholder="Nombre">
            <button class="bandejas-guardar" id="botonGuardarNuevaBandeja">Guardar</button>
        </article>
    </section>
</dialog>

    <footer class="footer">
    <a href="../Home/homeposts.html">
        <img class="fotoEnElFooter" src="../home naranja.png" alt="foto home naranja">
    </a>
    <a href="../Mensajeria/mensajes.html">
        <img class="fotoEnElFooter" src="../mensajeria negro.png" alt="foto mensajeria">
    </a>
    <div>
    <a href="#" class="fcuadraditote" id="botonMas">
        <img class="fotoEnElFooter" src="../mas negro.png" alt="mas">
    </a>
    </div>
    <a href="../Rachas/rachas.html">
        <img class="fotoEnElFooter" src="../triple m negro.png" alt="foto rachas">
    </a>
    <a href="../Perfil/perfil.html">
        <img class="fotoEnElFooter" src="../perfil negro.png" alt="foto perfil">
    </a>
    </footer>

    <dialog class="menuCrearpopup" id="menuCrearpopup">
        <section class="crearpopup" id="crearpopup">
            <a href="../Añadir/Añadir-publicación.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Post</div>
                    <div class="marcaelmomentopopup">Subi un post y marca el momento</div>
                </section>
            </a>
            <a href="../Añadir/Añadir-receta.html" class="publicacionorecetapopup">
                <img class="imagensubirpopup" src="../Group 65.png" alt="imagensubirfoto">
                <section class="textosdepostorecetapopup">
                    <div class="titulopopup">Receta</div>
                    <div class="marcaelmomentopopup">Compartí tu receta y dejá tu huella.</div>
                </section>
            </a>
        </section>
    </dialog>

</main>
<script src="homerecetas.js"></script>
<script src="../General/general.js"></script>
</body>
</html>
