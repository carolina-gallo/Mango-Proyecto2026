<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Información de la receta</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
  </style>
  <link rel="stylesheet" href="../General/general.css">
  <link rel="stylesheet" href="recetas-informacion.css">
</head>
<body>
<main class="app">
  <section class="contenedorRecetas" id="contenedorReceta"></section>
  
  <section class="comentarios" id="comentariosReceta">
  </section>


  <article class="comentarios-escribir">
    <figure class="comentarios-avatar mio"></figure>
    <div class="enviar-comentario">
      <input type="text" class="comentarios-input" id="input-comentario" placeholder="Únete a la conversación...">
      <img class="comentarios-enviar" src="enviar2.png" alt="enviar">
    </div>
  </article>

  <section class="final">
  <article class="ultimacosa">
    <p class="publicadopor"></p>
    <div class="usuariodereceta">
      <figure class="avatar-usuario"></figure>
      <p class="usuarioreceta" id="usuarioReceta">Pepito</p>
    </div>
  </article>

  <button type="button" class="seguir">Seguir</button>
</section>

  <dialog class="bandejas-fondo" id="popupBandejas">
    <section class="bandejas-popup" id="cajaPopupBandejas">

        <article class="bandejas-vista" id="vistaOpciones">
            <button class="bandejas-opcion" id="botonCrearBandeja">
                <span>Crear bandeja</span>
                <span class="bandejas-opcion-icono"><img src="mas-bandeja.png" alt="mas"></span>
            </button>
            <button class="bandejas-opcion" id="botonBandejaExistente">
                <span>Agregar a bandeja ya existente</span>
                <span class="bandejas-opcion-icono"><img src="flecha-bandeja.png" alt="flecha"></span>
            </button>
        </article>

        <article class="bandejas-vista" id="vistaBandejas" hidden>
            <section class="bandejas-grilla" id="grillaBandejas"></section>
            <button class="bandejas-guardar" id="botonGuardarEnBandeja">Guardar</button>
        </article>

        <article class="bandejas-vista" id="vistaNuevaBandeja" hidden>
            <input type="text" class="bandejas-nombre" id="inputNombreBandeja" placeholder="Nombre">
            <button class="bandejas-guardar" id="botonGuardarNuevaBandeja">Guardar</button>
        </article>
    </section>
</dialog>
</main>
<footer class="footer">
    <a href="../Home/homeposts.html" class="fcolorcitos">H</a>
    <a href="../Mensajeria/mensajes.html" class="fcolorcitos">M</a>
    <div>
    <a href="#" class="fcuadraditote" id="botonMas">+</a>
    </div>
    <a href="../Rachas/rachas.html" class="fcolorcitos">R</a>
    <a href="../Perfil/perfil.html" class="fcolorcitos naranjita">P</a>
</footer>


  <script src="recetas-informacion.js"></script>
</body>
</html>
